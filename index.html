<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>飞车都市 · Cybertruck City</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#05070c;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#e8eef8}
#c{display:block;width:100%;height:100%;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none;z-index:10}
#ui .panel{pointer-events:auto}
#hud{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:6px;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.stat{background:rgba(8,14,28,.72);border:1px solid rgba(120,180,255,.25);border-radius:10px;padding:8px 12px;min-width:140px}
.stat .label{font-size:11px;opacity:.7}
.stat .value{font-size:20px;font-weight:700;color:#7ec8ff}
.stat .value.gold{color:#ffd76a}.stat .value.green{color:#6dffb0}
#missionBox{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(8,14,28,.78);border:1px solid rgba(130,230,255,.35);border-radius:12px;padding:10px 16px;text-align:center;min-width:240px;display:none}
#missionBox h3{font-size:13px;color:#9fe7ff;margin-bottom:3px}#missionBox p{font-size:12px;opacity:.9}
#toast{position:absolute;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(20,40,80,.88);border:1px solid rgba(120,200,255,.4);padding:8px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
#controlsHint{position:absolute;right:12px;bottom:12px;background:rgba(8,14,28,.72);border:1px solid rgba(120,180,255,.22);border-radius:10px;padding:10px 12px;font-size:11px;line-height:1.5;max-width:230px}
#controlsHint kbd{display:inline-block;min-width:16px;padding:0 4px;border-radius:3px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);font-size:10px}
#menu{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,rgba(30,60,120,.5),rgba(4,8,16,.94));pointer-events:auto}
#menu.hidden{display:none}
.card{width:min(420px,92vw);background:rgba(10,16,30,.92);border:1px solid rgba(120,180,255,.3);border-radius:18px;padding:24px 22px 18px;box-shadow:0 16px 48px rgba(0,0,0,.5)}
.card h1{font-size:26px;font-weight:800;background:linear-gradient(90deg,#c8d0d8,#9fd4ff);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:6px}
.card .sub{font-size:12px;opacity:.75;margin-bottom:14px;line-height:1.5}
.quality{display:flex;gap:8px;align-items:center;margin-bottom:14px;font-size:13px}
.quality span{opacity:.75;margin-right:4px}
.quality button{flex:1;padding:8px 0;border-radius:8px;border:1px solid rgba(120,180,255,.3);background:rgba(30,50,90,.5);color:#dff;cursor:pointer;font-size:13px}
.quality button.on{border-color:#7ec8ff;background:rgba(50,100,180,.65);font-weight:700}
.modes{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.modes button{appearance:none;border:1px solid rgba(120,180,255,.35);background:linear-gradient(180deg,rgba(40,70,120,.55),rgba(20,35,70,.7));color:#eaf3ff;border-radius:11px;padding:12px 14px;text-align:left;cursor:pointer;font-size:14px;font-weight:600}
.modes button:hover{border-color:#8fd6ff}
.modes button span{display:block;font-size:11px;font-weight:400;opacity:.7;margin-top:3px}
.help{font-size:11px;opacity:.65;line-height:1.55}
#pauseBtn,#menuBtn,#qualBtn{position:absolute;top:12px;background:rgba(8,14,28,.72);border:1px solid rgba(120,180,255,.3);color:#dff;border-radius:9px;padding:7px 11px;font-size:12px;cursor:pointer;pointer-events:auto}
#pauseBtn{right:12px}#menuBtn{right:78px;display:none}#qualBtn{right:144px;display:none}
#pauseOverlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45);pointer-events:auto}
#pauseOverlay.show{display:flex}
#pauseOverlay .inner{background:rgba(12,18,32,.94);border:1px solid rgba(120,180,255,.3);border-radius:14px;padding:22px 26px;text-align:center}
#pauseOverlay button{margin-top:12px;margin-right:6px;padding:9px 16px;border-radius:9px;border:1px solid rgba(120,180,255,.4);background:rgba(40,80,140,.6);color:#fff;cursor:pointer}
#speedBar{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:min(280px,65vw);height:6px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden}
#speedFill{height:100%;width:0%;background:linear-gradient(90deg,#3ad0ff,#7aff9a,#ffd76a)}
#fps{position:absolute;left:12px;bottom:12px;font-size:11px;opacity:.55;font-variant-numeric:tabular-nums}
#mobilePad{display:none;position:absolute;left:0;right:0;bottom:0;height:170px;pointer-events:none}
@media (pointer:coarse){#mobilePad{display:block}#controlsHint{display:none}}
.joy{position:absolute;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);pointer-events:auto;touch-action:none;left:20px;bottom:24px}
.joy .knob{position:absolute;left:50%;top:50%;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;background:rgba(140,200,255,.45)}
.flyBtns{position:absolute;right:20px;bottom:24px;display:flex;flex-direction:column;gap:8px;pointer-events:auto}
.flyBtns button{width:58px;height:44px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(20,40,80,.75);color:#fff;font-size:13px}
</style>

<body>

  <div id="hud">
    <div class="stat"><div class="label">速度 KM/H</div><div class="value" id="spd">0</div></div>

    <div class="card">
      <h1>飞车都市</h1>
      <p class="sub">驾驶赛博卡车穿梭美式都市：Central Park 起飞，Downtown 摩天楼与 Harbor 天际线。可调画质保帧数。</p>

        <span>画质</span>

    </div>
  </div>
  <div id="pauseOverlay">
    <div class="inner">
      <h2 style="margin-bottom:6px">已暂停</h2>
      <p style="opacity:.7;font-size:12px;margin-bottom:8px">画质可随时切换</p>
      <div class="quality" id="qualityPause" style="justify-content:center;margin-bottom:4px">
        <button type="button" data-q="high">高</button>

<script type="module">
import * as THREE from 'three';

const canvas = document.getElementById('c');
const elSpd = document.getElementById('spd');
const elAlt = document.getElementById('alt');
const elScore = document.getElementById('score');
const missionBox = document.getElementById('missionBox');
const mTitle = document.getElementById('mTitle');
const mDesc = document.getElementById('mDesc');
const toastEl = document.getElementById('toast');
const menuEl = document.getElementById('menu');
const pauseOverlay = document.getElementById('pauseOverlay');
const speedFill = document.getElementById('speedFill');
const menuBtn = document.getElementById('menuBtn');
const qualBtn = document.getElementById('qualBtn');
const fpsEl = document.getElementById('fps');

function toast(msg, ms=1800){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>toastEl.classList.remove('show'), ms);
}

const QUAL = {
  high: { pr:1.5, shadows:true, shadowSize:512, far:800, fogN:0.0011, fogD:0.0007, blocks:4, extraTowers:6, lamps:true, antialias:true, treeCount:5, coins:20, headlight:true, tone:2, taxis:6, signs:4 },
  med:  { pr:1, shadows:false, shadowSize:256, far:560, fogN:0.0016, fogD:0.0009, blocks:3, extraTowers:4, lamps:true, antialias:false, treeCount:3, coins:14, headlight:false, tone:1, taxis:3, signs:3 },
  low:  { pr:1, shadows:false, shadowSize:256, far:420, fogN:0.0022, fogD:0.0013, blocks:2, extraTowers:2, lamps:false, antialias:false, treeCount:1, coins:10, headlight:false, tone:0, taxis:0, signs:2 },
};
let quality = localStorage.getItem('fcc_quality') || 'low';
if(!QUAL[quality]) quality = 'low';

const renderer = new THREE.WebGLRenderer({
  canvas, antialias: QUAL[quality].antialias, powerPreference:'high-performance',
  alpha:false, stencil:false, depth:true
});
renderer.setClearColor(0x0a1220, 1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = false;
renderer.shadowMap.type = THREE.BasicShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a1220);
scene.fog = new THREE.FogExp2(0x0a1220, 0.0014);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.8, QUAL[quality].far);

const hemi = new THREE.HemisphereLight(0x8eb6ff, 0x1a2030, 0.6);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffe2b8, 0.9);
sun.position.set(120, 220, 60);
sun.castShadow = false;
scene.add(sun);
const amb = new THREE.AmbientLight(0x223355, 0.28);
scene.add(amb);

let isNight = true;

/* Wider US avenues */
const CITY = 520;
const BLOCK = 88;
const ROAD_W = 26;      // avenue width
const SIDE_ROAD = 18;

function makeWindowTexture(night, size, style){
  // style: 'glass' | 'brick'
  const w = size, h = size*2;
  const c = document.createElement('canvas');
  c.width=w; c.height=h;
  const g=c.getContext('2d');
  if(style==='brick'){
    g.fillStyle = night ? '#3a2a24' : '#8b5a44';
    g.fillRect(0,0,w,h);
    const cols=4, rows=8, cw=w/cols, rh=h/rows;
    for(let y=0;y<rows;y++) for(let x=0;x<cols;x++){
      const lit = night ? Math.random()>0.35 : Math.random()>0.9;
      g.fillStyle = lit ? (Math.random()>0.5?'#f0d080':'#ffe8a0') : (night?'#2a1e18':'#6e4534');
      g.fillRect(x*cw+1, y*rh+2, cw-2, rh-4);
    }
  } else {
    g.fillStyle = night ? '#1a2838' : '#4a6070';
    g.fillRect(0,0,w,h);
    const cols=night?6:5, rows=night?12:10, cw=w/cols, rh=h/rows;
    for(let y=0;y<rows;y++) for(let x=0;x<cols;x++){
      const lit = night ? Math.random()>0.22 : Math.random()>0.85;
      if(!lit) g.fillStyle = night?'#0c1520':'#3a4c58';
      else g.fillStyle = Math.random()>0.55 ? '#e8c070' : '#a8d0f0';
      g.fillRect(x*cw+1,y*rh+1,cw-2,rh-2);
    }
  }
  const tex=new THREE.CanvasTexture(c);
  tex.colorSpace=THREE.SRGBColorSpace;
  tex.wrapS=tex.wrapT=THREE.RepeatWrapping;
  tex.magFilter=THREE.NearestFilter;
  tex.minFilter=THREE.LinearFilter;
  tex.generateMipmaps=false;
  return tex;
}

function makeSignTexture(text, bg, fg){
  const c=document.createElement('canvas');
  c.width=256; c.height=128;
  const g=c.getContext('2d');
  g.fillStyle=bg; g.fillRect(0,0,256,128);
  g.strokeStyle='#ffffff55'; g.lineWidth=4; g.strokeRect(4,4,248,120);
  g.fillStyle=fg; g.font='bold 28px Arial,sans-serif';
  g.textAlign='center'; g.textBaseline='middle';
  const lines=text.split('|');
  lines.forEach((ln,i)=> g.fillText(ln, 128, 64 + (i-(lines.length-1)/2)*32));
  const tex=new THREE.CanvasTexture(c);
  tex.colorSpace=THREE.SRGBColorSpace;
  tex.magFilter=THREE.LinearFilter;
  tex.generateMipmaps=false;
  return tex;
}

let dayGlass, nightGlass, dayBrick, nightBrick;
let buildingMatGlass, buildingMatBrick;
let buildingMeshGlass, buildingMeshBrick;
const colliders = [];
const dummy = new THREE.Object3D();

const groundMat = new THREE.MeshLambertMaterial({color:0x2e3540});
const roadMat = new THREE.MeshLambertMaterial({color:0x1a1e26});
const parkMat = new THREE.MeshLambertMaterial({color:0x2f6b3e});
const lineMat = new THREE.MeshBasicMaterial({color:0xd8c060}); // US yellow lane feel
const crosswalkMat = new THREE.MeshBasicMaterial({color:0xd0d4dc});
const lampPoleMat = new THREE.MeshLambertMaterial({color:0x2a2a2a});
const lampHeadMat = new THREE.MeshBasicMaterial({color:0xffe0a0});
const treeMat = new THREE.MeshLambertMaterial({color:0x1f6b3a});
const trunkMat = new THREE.MeshLambertMaterial({color:0x4a3020});
const waterMat = new THREE.MeshLambertMaterial({color:0x3a7aaa});
const taxiMat = new THREE.MeshLambertMaterial({color:0xf5c400});
const taxiDark = new THREE.MeshLambertMaterial({color:0x222222});

const boxGeo = new THREE.BoxGeometry(1,1,1);
const planeGeo = new THREE.PlaneGeometry(1,1);
const cylGeo = new THREE.CylinderGeometry(0.5,0.5,1,6);
const sphereGeo = new THREE.SphereGeometry(0.5,6,4);
const wheelGeoCT = new THREE.CylinderGeometry(0.5,0.5,1,8); // geometric Cybertruck-ish

const ground = new THREE.Mesh(new THREE.PlaneGeometry(CITY*2.2, CITY*2.2), groundMat);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

const cityRoot = new THREE.Group();
scene.add(cityRoot);
const lampHeads = [];
const taxis = []; // {mesh, x,z, yaw, speed, lane}

function clearCity(){
  while(cityRoot.children.length){
    const o=cityRoot.children[0];
    cityRoot.remove(o);
    if(o.geometry && o.geometry!==boxGeo && o.geometry!==planeGeo && o.geometry!==cylGeo && o.geometry!==sphereGeo && o.geometry!==wheelGeoCT){
      try{ o.geometry.dispose(); }catch(e){}
    }
  }
  colliders.length=0; lampHeads.length=0; taxis.length=0;
  buildingMeshGlass=buildingMeshBrick=null;
}

function addCollider(x,z,w,d,h){
  const hw=w*0.48, hd=d*0.48;
  colliders.push({minx:x-hw,maxx:x+hw,miny:0,maxy:h,minz:z-hd,maxz:z+hd});
}

function addBillboard(x,y,z, yaw, tex){
  const mat=new THREE.MeshBasicMaterial({map:tex, side:THREE.DoubleSide});
  const m=new THREE.Mesh(planeGeo, mat);
  m.scale.set(28,14,1);
  m.position.set(x,y,z);
  m.rotation.y=yaw;
  cityRoot.add(m);
  // pole
  const pole=new THREE.Mesh(cylGeo, lampPoleMat);
  pole.scale.set(0.5,y,0.5); pole.position.set(x,y*0.5,z); cityRoot.add(pole);
}

function buildCity(q){
  clearCity();
  const half = q.blocks;
  const glassBuilds = [];
  const brickBuilds = [];

  /* —— Central Park —— */
  const park = new THREE.Mesh(planeGeo, parkMat);
  park.scale.set(110,110,1);
  park.rotation.x = -Math.PI/2;
  park.position.set(0,0.05,0);
  cityRoot.add(park);

  // fountain
  const fountainBase=new THREE.Mesh(cylGeo, new THREE.MeshLambertMaterial({color:0x9aa3b0}));
  fountainBase.scale.set(8,1.2,8); fountainBase.position.set(0,0.6,0); cityRoot.add(fountainBase);
  const pool=new THREE.Mesh(cylGeo, waterMat);
  pool.scale.set(6.5,0.4,6.5); pool.position.set(0,1.1,0); cityRoot.add(pool);
  const spout=new THREE.Mesh(cylGeo, new THREE.MeshLambertMaterial({color:0xb0b8c4}));
  spout.scale.set(0.8,3.5,0.8); spout.position.set(0,2.5,0); cityRoot.add(spout);

  for(let i=0;i<q.treeCount;i++){
    const a=Math.random()*Math.PI*2, r=18+Math.random()*32;
    const tx=Math.cos(a)*r, tz=Math.sin(a)*r;
    const trunk=new THREE.Mesh(cylGeo, trunkMat);
    trunk.scale.set(0.7,3,0.7); trunk.position.set(tx,1.5,tz); cityRoot.add(trunk);
    const crown=new THREE.Mesh(sphereGeo, treeMat);
    crown.scale.set(4.2,4.2,4.2); crown.position.set(tx,4,tz); cityRoot.add(crown);
  }

  /* —— Wide avenue grid —— */
  function road(x,z,w,d){
    const m=new THREE.Mesh(planeGeo, roadMat);
    m.scale.set(w,d,1); m.rotation.x=-Math.PI/2; m.position.set(x,0.04,z); cityRoot.add(m);
  }
  // Broadway-ish main N-S + E-W avenues
  road(0,0,ROAD_W, CITY*1.7);
  road(0,0,CITY*1.7, ROAD_W);
  for(let i=-half;i<=half;i++){
    if(i===0) continue;
    const c=i*BLOCK;
    road(c,0,SIDE_ROAD, CITY*1.3);
    road(0,c,CITY*1.3, SIDE_ROAD);
  }
  // yellow dashed lanes on main avenues
  for(let t=-CITY*0.75;t<CITY*0.75;t+=22){
    const ln=new THREE.Mesh(planeGeo, lineMat);
    ln.scale.set(1.2,4,1); ln.rotation.x=-Math.PI/2; ln.position.set(0,0.06,t); cityRoot.add(ln);
    const ln2=new THREE.Mesh(planeGeo, lineMat);
    ln2.scale.set(4,1.2,1); ln2.rotation.x=-Math.PI/2; ln2.position.set(t,0.06,0); cityRoot.add(ln2);
  }
  // crosswalks near park
  for(const [x,z,sx,sz] of [[0,58,ROAD_W,3],[0,-58,ROAD_W,3],[58,0,3,ROAD_W],[-58,0,3,ROAD_W]]){
    const cw=new THREE.Mesh(planeGeo, crosswalkMat);
    cw.scale.set(sx,sz,1); cw.rotation.x=-Math.PI/2; cw.position.set(x,0.07,z); cityRoot.add(cw);
  }

  /* —— Buildings: brick midrise + glass towers —— */
  for(let ix=-half;ix<=half;ix++){
    for(let iz=-half;iz<=half;iz++){
      if(Math.abs(ix)<1 && Math.abs(iz)<1) continue;
      const cx=ix*BLOCK, cz=iz*BLOCK;
      let px,pz;
      if(Math.abs(ix)>=1 && Math.abs(iz)>=1){
        px = cx + (ix>0?1:-1)*BLOCK*0.24;
        pz = cz + (iz>0?1:-1)*BLOCK*0.24;
      } else if(Math.abs(ix)<1){
        px = (Math.random()>0.5?1:-1)*BLOCK*0.3;
        pz = cz + (iz>=0?1:-1)*BLOCK*0.24;
      } else {
        pz = (Math.random()>0.5?1:-1)*BLOCK*0.3;
        px = cx + (ix>=0?1:-1)*BLOCK*0.24;
      }
      const dist = Math.abs(ix)+Math.abs(iz);
      const isGlass = dist>=3 || Math.random()>0.45;
      if(isGlass){
        const w=18+Math.random()*22, d=18+Math.random()*22;
        const h=40+Math.random()*Math.random()*140+(dist>4?30:0);
        glassBuilds.push({x:px,z:pz,w,d,h,shade:0.7+Math.random()*0.35});
      } else {
        // brownstone / midrise row feel
        const w=14+Math.random()*12, d=12+Math.random()*14;
        const h=12+Math.random()*28;
        brickBuilds.push({x:px,z:pz,w,d,h,shade:0.75+Math.random()*0.3});
      }
    }
  }
  for(let i=0;i<q.extraTowers;i++){

function wedgeGeo(w1, w2, h, len){
  // angular tapering box: front width w1, rear w2
  const hw1=w1/2, hw2=w2/2, hh=h/2, hl=len/2;
  const verts = new Float32Array([
    // bottom
    -hw1, -hh,  hl,   hw1, -hh,  hl,   hw2, -hh, -hl,  -hw2, -hh, -hl,
    // top
    -hw1*0.92, hh,  hl*0.85,   hw1*0.92, hh,  hl*0.85,   hw2*0.95, hh, -hl,  -hw2*0.95, hh, -hl,
  ]);
  // indices for box-like wedge
  const idx = [
    0,1,2, 0,2,3, // bottom
    4,6,5, 4,7,6, // top
    0,4,5, 0,5,1, // front
    1,5,6, 1,6,2, // right
    2,6,7, 2,7,3, // rear
    3,7,4, 3,4,0, // left
  ];
  const geo=new THREE.BufferGeometry();
  // expand to non-indexed for flat shading feel via computeVertexNormals after
  const pos=[];
  for(let i=0;i<idx.length;i+=3){
    for(let k=0;k<3;k++){
      const vi=idx[i+k]*3;
      pos.push(verts[vi],verts[vi+1],verts[vi+2]);
    }
  }
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  geo.computeVertexNormals();
  return geo;
}

  input.throttle=(keys['KeyW']||keys['ArrowUp'])?1:0;

  input.steer=0;
  if(keys['KeyA']||keys['ArrowLeft']) input.steer+=1;

  input.up=(keys['Space']||keys['KeyR'])?1:0;

  if(mobile.brake) input.brake=Math.max(input.brake,mobile.brake);

const joyMove=document.getElementById('joyMove');

(function bindJoy(el,knob){
  let active=false,pid=null,cx,cy; const R=44;
  function setFrom(x,y){
    let dx=x-cx,dy=y-cy; const len=Math.hypot(dx,dy)||1;
    if(len>R){dx=dx/len*R;dy=dy/len*R;}
    knob.style.transform=`translate(${dx}px,${dy}px)`;
    mobile.steer=-dx/R;
    if(dy<0){mobile.throttle=-dy/R;mobile.brake=0;} else {mobile.brake=dy/R;mobile.throttle=0;}
  }
  function clear(){mobile.throttle=mobile.brake=mobile.steer=0;knob.style.transform='translate(0,0)';}
  el.addEventListener('pointerdown',e=>{active=true;pid=e.pointerId;el.setPointerCapture(pid);const r=el.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2;setFrom(e.clientX,e.clientY);});
  el.addEventListener('pointermove',e=>{if(active&&e.pointerId===pid)setFrom(e.clientX,e.clientY);});
  el.addEventListener('pointerup',e=>{if(e.pointerId===pid){active=false;clear();}});
  el.addEventListener('pointercancel',()=>{active=false;clear();});
})(joyMove,joyKnob);

let camMode=0;
const camSmooth=new THREE.Vector3(0,8,38);
const lookSmooth=new THREE.Vector3(0,1,0);
function cycleCamera(){
  camMode=(camMode+1)%3;
  toast('视角：'+['追逐','驾驶舱','高空'][camMode]);
}
function updateCamera(dt){
  const fx=-Math.sin(carState.yaw), fz=-Math.cos(carState.yaw);
  const pos=car.position;
  let dx,dy,dz,lx,ly,lz;
  if(camMode===0){ dx=pos.x-fx*12; dy=pos.y+4.5; dz=pos.z-fz*12; lx=pos.x+fx*8; ly=pos.y+1.3; lz=pos.z+fz*8; }
  else if(camMode===1){ dx=pos.x+fx*0.2; dy=pos.y+1.45; dz=pos.z+fz*0.2; lx=pos.x+fx*18; ly=pos.y+1.1; lz=pos.z+fz*18; }
  else { dx=pos.x-fx*5; dy=pos.y+28; dz=pos.z-fz*5; lx=pos.x; ly=pos.y; lz=pos.z; }
  const k=1-Math.pow(0.0008,dt);
  const kk=camMode===1?Math.min(1,k*2):k;
  camSmooth.x+=(dx-camSmooth.x)*kk; camSmooth.y+=(dy-camSmooth.y)*kk; camSmooth.z+=(dz-camSmooth.z)*kk;
  lookSmooth.x+=(lx-lookSmooth.x)*k; lookSmooth.y+=(ly-lookSmooth.y)*k; lookSmooth.z+=(lz-lookSmooth.z)*k;
  camera.position.copy(camSmooth);
  camera.lookAt(lookSmooth);
}

function applyQuality(name, rebuild){
  quality=name;
  localStorage.setItem('fcc_quality', quality);
  const q=QUAL[quality];
  renderer.setPixelRatio(Math.min(devicePixelRatio, q.pr));
  renderer.setSize(innerWidth, innerHeight, false);
  renderer.toneMapping = q.tone===2 ? THREE.ACESFilmicToneMapping : (q.tone===1 ? THREE.LinearToneMapping : THREE.NoToneMapping);
  renderer.toneMappingExposure = q.tone===2 ? 1.0 : 1.05;
  renderer.shadowMap.enabled=q.shadows;
  sun.castShadow=q.shadows;
  if(q.shadows){
    sun.shadow.mapSize.set(q.shadowSize,q.shadowSize);
    const sc=sun.shadow.camera;
    sc.near=20; sc.far=400; sc.left=-120; sc.right=120; sc.top=120; sc.bottom=-120;
    sun.shadow.bias=-0.001;
  }
  camera.far=q.far; camera.updateProjectionMatrix();
  const texSize = quality==='high'?32 : quality==='med'?24 : 16;
  if(dayGlass){ dayGlass.dispose(); nightGlass.dispose(); dayBrick.dispose(); nightBrick.dispose(); }
  dayGlass=makeWindowTexture(false, texSize, 'glass');
  nightGlass=makeWindowTexture(true, texSize, 'glass');
  dayBrick=makeWindowTexture(false, texSize, 'brick');
  nightBrick=makeWindowTexture(true, texSize, 'brick');
  if(rebuild) buildCity(q);
  else {
    if(buildingMatGlass){
      buildingMatGlass.map=isNight?nightGlass:dayGlass; buildingMatGlass.emissiveMap=buildingMatGlass.map; buildingMatGlass.needsUpdate=true;
      buildingMatBrick.map=isNight?nightBrick:dayBrick; buildingMatBrick.emissiveMap=buildingMatBrick.map; buildingMatBrick.needsUpdate=true;
    }
  }
  setDayNight(isNight);
  document.querySelectorAll('.quality button').forEach(b=> b.classList.toggle('on', b.dataset.q===quality));
  qualBtn.textContent='画质:'+({high:'高',med:'中',low:'低'}[quality]);
}

function clearMissionObjects(){
  while(ringGroup.children.length) ringGroup.remove(ringGroup.children[0]);
  while(coinGroup.children.length) coinGroup.remove(coinGroup.children[0]);
  rings=[]; coins=[]; ringIndex=0; missionDone=false;

function makeRing(x,y,z,yaw){
  const tor=new THREE.Mesh(sharedRingGeo, sharedRingMat.clone());
  tor.position.set(x,y,z);
  tor.rotation.order='YXZ';
  tor.rotation.set(Math.PI/2, yaw, 0);
  ringGroup.add(tor);
  return {mesh:tor, pos:new THREE.Vector3(x,y,z), passed:false};
}
function spawnRings(){
  clearMissionObjects();
  const path=[[0,10,-40],[55,22,-90],[100,35,-45],[120,45,35],[55,52,100],[-35,38,120],[-100,26,55],[-55,16,-15],[0,12,-70]];
  for(let i=0;i<path.length;i++){
    const [x,y,z]=path[i];
    let yaw=0;
    if(i<path.length-1) yaw=Math.atan2(-(path[i+1][0]-x), -(path[i+1][2]-z));
    rings.push(makeRing(x,y,z,yaw));
  }
  highlightRing(0);
}
function highlightRing(i){
  rings.forEach((r,idx)=>{
    const on=idx===i;
    r.mesh.material.color.setHex(on?0x33e0ff:0x226688);
    r.mesh.material.opacity=on?1:0.3;
  });
}
function spawnCoins(){
  clearMissionObjects();
  const n=QUAL[quality].coins;
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, r=40+Math.random()*230;
    const mesh=new THREE.Mesh(sharedCoinGeo, sharedCoinMat);
    mesh.rotation.x=Math.PI/2;
    mesh.position.set(Math.cos(a)*r, 5+Math.random()*70, Math.sin(a)*r);
    coinGroup.add(mesh);
    coins.push({mesh, taken:false});

function updateMission(dt){
  if(mode==='rings' && !missionDone){
    const r=rings[ringIndex]; if(!r) return;
    if(car.position.distanceToSquared(r.pos)<42){
      score+=100; elScore.textContent=score; ringIndex++;
      if(ringIndex>=rings.length){
        missionDone=true;
        const sec=((performance.now()-ringStartTime)/1000).toFixed(1);
        mTitle.textContent='完成！'; mDesc.textContent=`全部环门通过 · ${sec}s · 得分 ${score}`;
        toast('霓虹环竞速完成！');
      } else {
        highlightRing(ringIndex);
        mDesc.textContent=`环门 ${ringIndex+1} / ${rings.length} · 得分 ${score}`;
        toast(`通过环门 ${ringIndex}！`);
      }
    }
  } else if(mode==='coins' && !missionDone){
    for(const c of coins){
      if(c.taken) continue;
      if(car.position.distanceToSquared(c.mesh.position)<10){
        c.taken=true; c.mesh.visible=false; score+=25; elScore.textContent=score;
        const left=coins.reduce((n,x)=>n+(x.taken?0:1),0);
        mDesc.textContent=`剩余金币 ${left} · 得分 ${score}`;
        if(left===0){ missionDone=true; mTitle.textContent='完成！'; mDesc.textContent=`收集全部 · 得分 ${score}`; toast('金币寻宝完成！'); }
      }
    }
    for(const c of coins) if(!c.taken) c.mesh.rotation.z+=dt*2;
  }
}

function updateTaxis(dt){
  const lim=CITY*0.85;
  for(const t of taxis){
    t.t += t.speed*dt;
    if(t.t>lim || t.t<-lim) t.speed*=-1;
    if(t.alongMain){ t.mesh.position.set(t.lane,0,t.t); t.mesh.rotation.y = t.speed>=0?0:Math.PI; }
    else { t.mesh.position.set(t.t,0,t.lane); t.mesh.rotation.y = t.speed>=0?Math.PI/2:-Math.PI/2; }
  }
}

/* ========== PHYSICS ========== */
function resolveCollisions(){
  const hw=1.2, hd=2.5, y=carState.y;
  const minx=carState.x-hw, maxx=carState.x+hw, minz=carState.z-hd, maxz=carState.z+hd;
  const maxy=y+1.5;
  for(let i=0;i<colliders.length;i++){
    const b=colliders[i];
    if(maxx<b.minx||minx>b.maxx||maxz<b.minz||minz>b.maxz||maxy<b.miny||y>b.maxy) continue;
    const ox=Math.min(maxx-b.minx, b.maxx-minx);
    const oz=Math.min(maxz-b.minz, b.maxz-minz);
    const oy=Math.min(maxy-b.miny, b.maxy-y);
    if(oy<ox && oy<oz){
      if(y+(maxy-y)*0.5 < (b.miny+b.maxy)*0.5){ carState.y-=oy+0.05; carState.vert=Math.min(carState.vert,-1); }
      else { carState.y+=oy+0.05; carState.vert=Math.max(carState.vert,1); }
    } else if(ox<oz){
      carState.x += (carState.x>(b.minx+b.maxx)*0.5 ? 1 : -1)*(ox+0.05);
      carState.speed*=-0.25;
    } else {
      carState.z += (carState.z>(b.minz+b.maxz)*0.5 ? 1 : -1)*(oz+0.05);
      carState.speed*=-0.25;
    }
    carState.speed*=0.55;
    car.position.set(carState.x,carState.y,carState.z);
    break;
  }
}

function updateCar(dt){
  readKeys();
  const maxSpeed=52, accel=28, brakeForce=40, fric=8;
  if(input.throttle) carState.speed += accel*dt*(carState.speed<0?1.4:1);
  if(input.brake){
    if(carState.speed>0.8) carState.speed-=brakeForce*dt;
    else carState.speed-=accel*0.6*dt;
  }
  if(!input.throttle && !input.brake){
    if(carState.speed>0) carState.speed=Math.max(0,carState.speed-fric*dt);
    else if(carState.speed<0) carState.speed=Math.min(0,carState.speed+fric*dt);
  }
  carState.speed=THREE.MathUtils.clamp(carState.speed,-16,maxSpeed);
  const steerEff=input.steer*2.0*Math.min(1,Math.abs(carState.speed)/8);
  if(Math.abs(carState.speed)>0.3) carState.yaw+=steerEff*dt*Math.sign(carState.speed||1);
  carState.steer += (input.steer*0.45-carState.steer)*(1-Math.pow(0.01,dt));

  if(input.up){ carState.vert+=22*dt; carState.flying=true; }
  else if(input.down){ carState.vert-=22*dt; carState.flying=true; }
  else { carState.vert*=Math.pow(0.02,dt); if(Math.abs(carState.vert)<0.05) carState.vert=0; }
  carState.vert=THREE.MathUtils.clamp(carState.vert,-32,32);
  carState.y+=carState.vert*dt;
  if(carState.y<=0.95){ carState.y=0.95; if(carState.vert<0) carState.vert=0; carState.flying=false; }
  carState.y=Math.min(carState.y,160);

  const fx=-Math.sin(carState.yaw), fz=-Math.cos(carState.yaw);
  carState.x+=fx*carState.speed*dt; carState.z+=fz*carState.speed*dt;
  const lim=CITY*0.95;
  carState.x=THREE.MathUtils.clamp(carState.x,-lim,lim);
  carState.z=THREE.MathUtils.clamp(carState.z,-lim,lim);

  car.position.set(carState.x,carState.y,carState.z);
  car.rotation.y=carState.yaw;
  car.rotation.z=-carState.steer*0.14;
  car.rotation.x=THREE.MathUtils.clamp(-carState.vert*0.01,-0.12,0.12);

  const spin=carState.speed*dt*1.5;
  for(const w of car.userData.wheels) w.rotation.x+=spin;

  const th=car.userData.thruster;
  const want=carState.flying?Math.min(0.65,0.2+Math.abs(carState.vert)*0.015):0;
  th.material.opacity += (want-th.material.opacity)*(1-Math.pow(0.01,dt));

  resolveCollisions();
}

/* ========== GAME FLOW ========== */
let playing=false, paused=false, last=performance.now();
let fpsFrames=0, fpsLast=performance.now();
let hudAcc=0;

function resetCar(){
  Object.assign(carState,{x:0,y:0.95,z:24,yaw:0,speed:0,vert:0,flying:false,steer:0});
  car.position.set(0,0.95,24); car.rotation.set(0,0,0);
  camSmooth.set(0,9,40); lookSmooth.set(0,1,0); camera.position.copy(camSmooth);
}
function startMode(m){
  mode=m; score=0; elScore.textContent='0'; missionDone=false;
  menuEl.classList.add('hidden');
  menuBtn.style.display='inline-block'; qualBtn.style.display='inline-block';
  playing=true; paused=false; pauseOverlay.classList.remove('show');
  resetCar(); clearMissionObjects();
  if(m==='free'){
    missionBox.style.display='block'; mTitle.textContent='自由驾驶 · Free Drive';
    mDesc.textContent='Central Park 起飞 · 空格飞行 · 撞楼弹开'; toast('自由驾驶 · Central Park');
  } else if(m==='rings'){
    spawnRings(); ringStartTime=performance.now();
    missionBox.style.display='block'; mTitle.textContent='霓虹环竞速';
    mDesc.textContent=`环门 1 / ${rings.length}`; toast('穿过发光环门！');
  } else {
    spawnCoins();
    missionBox.style.display='block'; mTitle.textContent='金币寻宝';
    mDesc.textContent=`剩余金币 ${coins.length}`; toast('收集漂浮金币！');
  }
}
function backToMenu(){
  playing=false; paused=false; pauseOverlay.classList.remove('show');
  menuEl.classList.remove('hidden'); menuBtn.style.display='none'; qualBtn.style.display='none';
  missionBox.style.display='none'; clearMissionObjects();
}
function togglePause(){ if(!playing) return; paused=!paused; pauseOverlay.classList.toggle('show',paused); }

document.querySelectorAll('.modes button').forEach(btn=>btn.addEventListener('click',()=>startMode(btn.dataset.mode)));
document.getElementById('pauseBtn').addEventListener('click', togglePause);
document.getElementById('resumeBtn').addEventListener('click', togglePause);
document.getElementById('toMenuBtn').addEventListener('click', backToMenu);
menuBtn.addEventListener('click', backToMenu);
qualBtn.addEventListener('click', ()=>{
  const order=['low','med','high'];
  applyQuality(order[(order.indexOf(quality)+1)%3], true);
  toast('画质：'+({high:'高',med:'中',low:'低'}[quality]));
});
document.querySelectorAll('.quality button').forEach(btn=>{
  btn.addEventListener('click', ()=>{ applyQuality(btn.dataset.q, true); toast('画质：'+({high:'高',med:'中',low:'低'}[quality])); });
});

window.addEventListener('resize', ()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight, false);
});

function tick(now){
  requestAnimationFrame(tick);
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  fpsFrames++;
  if(now-fpsLast>=500){
    const fps=Math.round(fpsFrames*1000/(now-fpsLast));
    fpsEl.textContent=fps+' FPS · '+({high:'高',med:'中',low:'低'}[quality]);
    fpsFrames=0; fpsLast=now;
  }
  if(playing && !paused){
    updateCar(dt);
    updateMission(dt);
    updateTaxis(dt);
    updateCamera(dt);
    hudAcc+=dt;
    if(hudAcc>0.1){
      hudAcc=0;
      elSpd.textContent=(Math.abs(carState.speed)*3.6)|0;
      elAlt.textContent=Math.max(0,(carState.y-0.95)|0);
      speedFill.style.width=Math.min(100,(Math.abs(carState.speed)/52)*100)+'%';
    }
  } else if(!playing){
    const t=now*0.00012;
    camera.position.set(Math.sin(t)*52, 26, Math.cos(t)*52);
    camera.lookAt(0,6,0);
  }
  renderer.render(scene, camera);
}

applyQuality(quality, true);
try{
  const q=new URLSearchParams(location.search).get('mode');
  if(q==='free'||q==='rings'||q==='coins') setTimeout(()=>startMode(q),150);
}catch(e){}
requestAnimationFrame(tick);
</script>
